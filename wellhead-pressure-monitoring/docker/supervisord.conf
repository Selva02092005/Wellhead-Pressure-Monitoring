[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:redis]
command=redis-server --daemonize no --bind 127.0.0.1 --protected-mode no
autostart=true
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.err.log
priority=10

[program:mosquitto]
command=mosquitto -c /etc/mosquitto/mosquitto.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/mosquitto.log
stderr_logfile=/var/log/mosquitto.err.log
priority=10

[program:backend]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
environment=PYTHONUNBUFFERED="1",PATH="/opt/venv/bin:%(ENV_PATH)s",POSTGRES_URL="%(ENV_POSTGRES_URL)s",REDIS_URL="%(ENV_REDIS_URL)s",MQTT_BROKER="%(ENV_MQTT_BROKER)s",MQTT_PORT="%(ENV_MQTT_PORT)s",JWT_SECRET="%(ENV_JWT_SECRET)s",ENVIRONMENT="%(ENV_ENVIRONMENT)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend.err.log
priority=20

[program:simulator]
command=/opt/venv/bin/python /app/simulator/simulator.py
directory=/app/simulator
environment=PYTHONUNBUFFERED="1",PATH="/opt/venv/bin:%(ENV_PATH)s",MQTT_BROKER="%(ENV_MQTT_BROKER)s",MQTT_PORT="%(ENV_MQTT_PORT)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/simulator.log
stderr_logfile=/var/log/simulator.err.log
priority=30

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx.err.log
priority=40
